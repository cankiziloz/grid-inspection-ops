[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "grid-inspection-ops"
version = "0.1.0"
description = "Auditable grid anomaly inspection workflow"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115,<1",
  "python-dotenv>=1,<2",
  "uvicorn[standard]>=0.30,<1",
  "langgraph>=0.2,<1",
  "langchain-ollama>=0.2,<1",
  "pydantic>=2.8,<3",
  "python-multipart>=0.0.9,<1",
  "sqlalchemy>=2.0,<3",
  "torch>=2.3,<3",
  "torchvision>=0.18,<1",
  "pillow>=10,<12",
  "numpy>=1.26,<3",
  "opencv-python-headless>=4.10,<5",
  "huggingface-hub>=0.27,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "httpx>=0.27,<1", "ruff>=0.6,<1"]
rag = ["pinecone>=10,<11"]

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["frontend*", "tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
